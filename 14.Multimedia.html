<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Multimedia</title>
</head>

<body>
   <h1 style="text-align: center;">Multimedia in HTML</h1>

   <h2>HTML Audio</h2>
   <audio controls autoplay muted preload="metadata" loop>
      <source src="./Media/tiktok-audio.mp3" type="audio/mpeg">
      <source src="./Media/tiktok-audio.ogg" type="audio/ogg">
      Your browser does not support the audio element.
   </audio>
   <hr>

   <h2>HTML Video</h2>
   <video controls autoplay muted loop preload="metadata" poster="./Media/natural.png" width="540" height="360">
      <source src="./Media/river-video.mp4" type="video/mp4">
      <source src="./Media/river-video.webm" type="video/webm">
        Your browser does not support the video element.
   </video>
</body>

</html>
