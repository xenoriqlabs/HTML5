<!-- 
Question:
Create a simple navigation menu for "Xenoriq Labs" using the <nav> semantic tag.

Requirements:
- Use <header>.
- Add <h1> with Xenoriq Labs.
- Use <nav>.
- Add these four links:
    Home
    About
    Services
    Contact
- Use <ul> and <li> inside <nav>. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Tag</title>
    <style>
        nav ul{
            list-style-type: none;
            text-align: center;
        }
        nav li{
            display: inline;
            margin: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Xenoriq Labs</h1>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
