<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
</head>

<body>
    <h1 style="text-align: center;">Iframe practice</h1>

    <h2>1. Simple Iframe</h2>
    <iframe src="https://www.uosahiwal.edu.pk/" style="width: 800px; height: 500px;"></iframe>
    <br>
    <hr>

    <h2>2. Embed another Page of same Website</h2>
    <iframe src="about.html" style="width: 600px; height: 150px; border: none;" title="About Xenoriq Labs"></iframe>
    <br>
    <hr>

    <h2>3. name + target</h2>
    <iframe name="myframe" style="width: 500px; height: 300px;"></iframe><br>
    <a href="./about.html" target="myframe">About</a><br>

    <a href="./banner.html" target="myframe">
        Xenoriq Labs Banner
    </a>

</body>

</html>
