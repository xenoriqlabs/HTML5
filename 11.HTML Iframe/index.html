<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
</head>

<body>
    <h1 style="text-align: center;">Iframe practice</h1>

    <h2>1. Simple Iframe</h2>
    <iframe src="https://www.uosahiwal.edu.pk/" style="width: 800px; height: 500px;"></iframe>
    <br>
    <hr>

    <h2>2. Embed another Page of same Website</h2>
    <iframe src="about.html" style="width: 600px; height: 150px; border: none;" title="About Xenoriq Labs"></iframe>
    <br>
    <hr>

    <h2>3. name + target</h2>
    <iframe name="myframe" style="width: 500px; height: 300px;"></iframe><br>
    <a href="./about.html" target="myframe">About</a><br>

    <a href="./banner.html" target="myframe">
        Xenoriq Labs Banner
    </a>
    <br>
    <hr>

    <h2>4. Iframe from Map</h2>
    <h3>Meezan Bank - Farid Town Branch, Main Market Farid Town, Sahiwal, Pakistan</h3>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m26!1m12!1m3!1d3431.473829981581!2d73.08127407471274!3d30.67694182461123!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m11!3e6!4m3!3m2!1d30.677105899999997!2d73.08410479999999!4m5!1s0x3922c9786f42d75f%3A0xb018475d8716df6b!2sMeezan%20Bank%20-%20Farid%20Town%20Branch%2C%20Main%20Market%20Farid%20Town%2C%20Sahiwal%2C%20Pakistan!3m2!1d30.6767778!2d73.0835903!5e0!3m2!1sen!2s!4v1786698278272!5m2!1sen!2s"
        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <br>
    <hr>

    <h2>5. Youtube Video</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/MqYpDpMcDLE?si=BE3RGRq9SsTx677r"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
    </iframe>

</body>

</html>
