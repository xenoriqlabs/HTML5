<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
</head>

<body>
    <header>
        <h1 style="text-align: center;">Different buttons in HTML</h1>
    </header>

    <hr style="border-top: 2px solid aqua; width: 90%;">

    <div>
        <h2>1. Normal Button</h2>
        <button>Clik Me</button>
    </div>

    <hr>

    <div>
        <h2>2.Disabled Button</h2>
        <button disabled>Disabled Button</button>
    </div>

    <hr>

    <div>
        <h2>3. Button with JavaScript</h2>
        <button onclick="alert('Hello!')">Click Me</button>
    </div>

    <hr>

    <div>
        <h2>4. Submit Button</h2>
        <button type="submit">Submit</button>
    </div>

    <hr>

    <div>
        <h2>5. Reset Button</h2>
        <button type="reset">Reset</button>
    </div>

    <hr>

</body>

</html>
