<!--
Question:
Create a simple Xenoriq Labs webpage using
<main>, <figure>, and <figcaption>.

Requirements:

1. Use <header>
   Add <h1>: Xenoriq Labs

2. Use <main>

3. Inside <main>, create a <figure>.

4. Add the Xenoriq Labs banner image:
   ./Media/xenoriq-labs-banner.jpg

5. Add <figcaption>:
   Xenoriq Labs - Software Development & AI Solutions

6. Add a short paragraph below the figure
   describing the company.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure & FigCaption</title>
    <style>
        figure{
            text-align: center;
            margin: 20px auto;
        }
    </style>
</head>

<body>
    <header style="text-align: center;">
        <h1>Xenoriq Labs</h1>
    </header>

    <main>
        <figure>
            <img src="../Media/xenoriq-labs-banner.jpg" alt="Xenoriq Labs software house banner" style="width: 450px; height: 250px;">
            <figcaption>Xenoriq Labs - Software Development & AI Solutions</figcaption>
        </figure>

        <p>
            Xenoriq Labs is a modern software house focused on building powerful digital products, AI solutions, and
            scalable technology for businesses. Founded and led by CEO Saif Ur Rahman, we turn ideas into fast, reliable,
            and innovative digital solutions.
        </p>
    </main>
</body>

</html>
