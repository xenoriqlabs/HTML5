<!--
Question:
Create a simple Xenoriq Labs webpage using
<header>, <main>, and <search>.

Requirements:

1. Use <header>
   Add <h1>: Xenoriq Labs

2. Use <main>.

3. Add <h2>:
   Search Our Courses

4. Inside <search>, create a <form>.

5. Add:
   <input type="search">

6. Add a button:
   Search

7. Use this placeholder:
   Search courses...
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Tag</title>
</head>

<body>

    <header style="text-align: center;">
        <h1>Xenoriq Labs</h1>
    </header>

    <main>
        <h2>Search Our Courses</h2>

        <search>
            <form action="#">
                <input type="search" placeholder="Search courses...">
                <button type="submit">Search</button>
            </form>
        </search>

    </main>

</body>

</html>
