<!--
Question:
Create a simple Xenoriq Labs webpage using
<header>, <main>, and <progress>.

Requirements:

1. Use <header>
   Add <h1>: Xenoriq Labs

2. Use <main>.

3. Add <h2>:
   Website Development Progress

4. Add a short paragraph:
   "Our website development project is currently in progress."

5. Add a <progress> bar showing 70% completion.

6. Use:
   value="70"
   max="100"

7. Add text:
   70% Completed
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tag</title>
</head>

<body>
    <header style="text-align: center;">
        <h1>Xenoriq Labs</h1>
    </header>

    <main>
        <h2>Website Development Progress</h2>
        <p>
            Our website development project is currently in progress.
        </p>

        <p>
            <progress value="70" max="100"></progress>
            <strong>70% Completed</strong>
        </p>
    </main>

</body>

</html>
