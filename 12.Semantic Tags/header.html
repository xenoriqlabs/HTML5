<!-- 
Question:
Create a simple webpage for "Xenoriq Labs" using the <header> semantic tag.

Requirements:
- Website name: Xenoriq Labs
- Main heading using <h1>
- A short paragraph/tagline
- Use <header> to contain both. 
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
</head>

<body>

    <h1 style="text-align: center;">Simple Header</h1>

    <h2>1. Main Header</h2>
    <header>
        <h2>Xenoriq Labs</h2>
        <p>Web Development & AI Solutions</p>
    </header>
    <br>
    <hr>

    <!-- U can also make a header of seperate section or article etc. -->
    <h2>2. Header for section or article etc</h2>
    <article>
        <header>
            <h2>Introduction to HTML</h2>
            <p>Published on August 13, 2026</p>
        </header>
        <p>
            HTML is the standard markup language for creating webpages.
        </p>
    </article>
</body>

</html>
