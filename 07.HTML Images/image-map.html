<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Map</title>
</head>

<body>
    <header>
        <h1 style="text-align: center;">Image Map in HTML</h1>
    </header>

    <hr style="border-top: 2px solid aqua; width: 80%;">

    <!-- Image Map Generated by http://www.image-map.net/ -->
    <div>
        <h2>Image Map using online tool</h2>
        <img src="../Media/map-img.png" usemap="#image-map" width="350px" height="350px">

        <map name="image-map">
            <area target="_blank" alt="Laptop" title="Laptop" href="laptop.com" coords="34,44,271,349" shape="rect">
            <area target="_blank" alt="Mobile" title="Mobile" href="mobile.com" coords="291,247,333,173" shape="rect">
            <area target="_blank" alt="Cup" title="Cup" href="cup.com" coords="338,302,42" shape="circle">
        </map>
    </div>

</body>

</html>
