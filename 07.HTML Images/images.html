<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
</head>

<body>
    <h1 style="text-align: center;">Images in HTML</h1>
    <h2>1. Image with src and alt attrinute</h2>
    <img src="../Media/natural.png" alt="natural-image">
    <hr>

    <h2>2. Images in Another Folder: with width and height attrinute</h2>
    <img src="../Media/uos-pic.png" alt="uos-pic" width="250px" height="250px">
    <hr>

    <h2>3. Image as a link</h2>
    <a href="https://youtube.com/@xenoriqlabs?si=92vHH7FQY1ydUtUk" target="_blank">
        <img src="../Media/xenoriq-labs-logo.jpeg" alt="xenoriq labs" width="250px" height="250px">
    </a>
    <hr>

    <h2>4. Image on Another Server/Website</h2>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmGGLbNvdmKVABtZNtMinr7uPA0MGjesqv0_WpmujSvChv7S4gPdveHVw&s=10"
        alt="uos-pic" width="300px" height="300px">

    <h2>5. Animated Images</h2>
    <img src="../Media/animated-heart.gif" alt="animated-heart" width="350px" height="350px">

</html>
