<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Simple Form</title>
</head>

<body>

   <!--  GET → data URL mein
         POST → data request body mein -->
   <form action="/submit-form" method="post" enctype="multipart/form-data" novalidate>
      <label for="fullname">Full Name:</label><br>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" minlength="3" maxlength="50"
         autocomplete="name" autofocus required><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required><br>

      <label for="password">Password:</label><br>
      <input type="password" name="password" id="password" placeholder="Enter your password" autocomplete="new-password"
         required><br>

      <label for="confirm-password">Confirm Password</label><br>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password"
         autocomplete="new-password" required><br>

      <label>Gender:</label><br>

      <input type="radio" name="gender" id="male" value="Male" checked>
      <label for="male">Male</label><br>

      <input type="radio" name="gender" id="female" value="Female">
      <label for="female">Female</label><br>

      <input type="radio" name="gender" id="other" value="Other">
      <label for="other">Other</label><br>

      <label>Skills:</label><br>

      <input type="checkbox" name="skills" id="html" value="HTML" checked>
      <label for="html">HTML</label><br>

      <input type="checkbox" name="skills" id="css" value="CSS">
      <label for="css">CSS</label><br>

      <input type="checkbox" name="skills" id="js" value="JavaScript">
      <label for="js">JavaScript</label><br>

      <input type="checkbox" name="skills" id="react" value="React">
      <label for="react">React</label><br>

      <fieldset>
         <legend>Course Selection</legend>

         <labe for="course">Select Course</label>
            <select name="course" id="course">
               <option value="HTML">HTML</option>
               <option value="CSS">CSS</option>
               <option value="JavaScript">JavaScript</option>
               <option value="MERN Stack" selected>MERN Stack</option>
            </select>
      </fieldset>

      <div>
         <label for="message">Message:</label><br>
         <textarea name="message" id="message" cols="40" rows="5" placeholder="Enter your message" minlength="10"
            maxlength="500" required></textarea>
      </div>

      <div>
         <label for="dob">Date of Birth:</label>
         <input type="date" name="dob" id="dob" required>
      </div>

      <div>
         <label for="phone">Phone Number:</label>
         <input type="tel" name="phone" id="phone" pattern="[0-9]{11}" placeholder="Enter your phone number" required>
      </div>

      <div>
         <label for="website">Website URL</label>
         <input type="url" name="website" id="website" readonly value="https://xenoriqlabs.com"
            placeholder="https://example.com">
      </div>

      <div>
         <label for="age">Age:</label>
         <input type="number" name="age" id="age" placeholder="Enter your age" min="18" max="60" step="1" required>
      </div>

      <div>
         <label for="experience">Experience Level:</label>

         <!-- use disabled if you want -->
         <input type="range" name="experience" id="experience" min="0" max="10" value="5">
         <span>0 = Beginner & 10 = Expert</span><br>

         <output id="experience-output">Experience: 5 Years</output>
      </div>

      <div>
         <label for="color">Favorite Color:</label>
         <input type="color" name="color" id="color" value="#0040CA">
      </div>

      <div>
         <label for="profile">Profile Picture</label>
         <input type="file" name="profile" id="profile" accept="image/*" multiple>
      </div>

      <div>
         <input type="hidden" name="course-id" id="course-id" value="103">
      </div>

      <div>
         <label for="city">City:</label>

         <input type="text" name="city" id="city" list="cities" placeholder="Enter your city">
         <datalist id="cities">
            <option value="Sahiwal"></option>
            <option value="Lahore"></option>
            <option value="Karachi"></option>
            <option value="Islamabad"></option>
            <option value="Faisalabad"></option>
         </datalist>
      </div>

      <input type="submit" value="Register">
      <button type="reset">Reset</button>

   </form>

</body>

</html>
