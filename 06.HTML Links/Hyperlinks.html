<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlinks</title>
</head>

<body>
    <h1 style="text-align: center;">Hyperlinks in HTML</h1>
    <h2>1. Link for a text</h2>
    <a href="https://youtube.com/@xenoriqlabs?si=92vHH7FQY1ydUtUk" target="_blank">Click to visit Xenoriq Labs</a>
    <hr>

    <h2>2. Use an Image as a Link</h2>
    <a href="https://www.uosahiwal.edu.pk/" target="_blank">
        <img src="../Media/uos-pic.png" alt="uos-pic" style="width: 42px; height: 42px;">
    </a>
    <hr>

    <h2>3. Link to an Email Address</h2>
    <a href="mailto:drsaiftahir560@gmail.com">Send mail</a>
    <hr>

    <h2>4. Links Title</h2>
    <a href="https://youtube.com/@xenoriqlabs?si=92vHH7FQY1ydUtUk" target="_blank" title="Click to go a Software Company">Xenoriq Labs</a>
</body>

</html>
